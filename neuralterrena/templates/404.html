<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>404 | Neuralterrena API</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fb;
        --panel: rgba(255, 255, 255, 0.8);
        --text: #10233f;
        --muted: #5d6b82;
        --accent: #0f766e;
        --accent-soft: rgba(15, 118, 110, 0.12);
        --border: rgba(16, 35, 63, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.16), transparent 32%),
          radial-gradient(circle at bottom right, rgba(8, 145, 178, 0.12), transparent 28%),
          var(--bg);
      }

      .card {
        width: min(720px, 100%);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 60px rgba(16, 35, 63, 0.12);
      }

      .eyebrow {
        display: inline-flex;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        max-width: 52ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
      }

      .primary {
        background: var(--text);
        color: #fff;
      }

      .secondary {
        border: 1px solid var(--border);
        color: var(--text);
        background: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">Error 404</span>
      <h1>Endpoint no encontrado</h1>
      <p>
        {% if exception %}
          {{ exception }}
        {% else %}
          La URL solicitada no existe en esta API o ya no está disponible.
        {% endif %}
      </p>
      <div class="actions">
        <a class="primary" href="/api/docs/">Ver documentación</a>
        <a class="secondary" href="/admin/">Ir al admin</a>
      </div>
    </main>
  </body>
</html>
