<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSRF Error | Neuralterrena API</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff8f1;
        --panel: rgba(255, 255, 255, 0.84);
        --text: #3b220f;
        --muted: #775b46;
        --accent: #c2410c;
        --accent-soft: rgba(194, 65, 12, 0.12);
        --border: rgba(59, 34, 15, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Inter", "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(249, 115, 22, 0.14), transparent 32%),
          radial-gradient(circle at bottom right, rgba(251, 146, 60, 0.12), transparent 28%),
          var(--bg);
      }

      .card {
        width: min(720px, 100%);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(16px);
        box-shadow: 0 24px 60px rgba(59, 34, 15, 0.12);
      }

      .eyebrow {
        display: inline-flex;
        padding: 8px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 0.98;
      }

      p {
        margin: 0;
        max-width: 52ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 14px;
        text-decoration: none;
        font-weight: 600;
      }

      .primary {
        background: var(--text);
        color: #fff;
      }

      .secondary {
        border: 1px solid var(--border);
        color: var(--text);
        background: rgba(255, 255, 255, 0.7);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="eyebrow">CSRF</span>
      <h1>La petición no ha podido validarse</h1>
      <p>
        {% if exception %}
          {{ exception }}
        {% else %}
          El token CSRF no es válido o ha expirado. Reintenta la operación desde una sesión activa.
        {% endif %}
      </p>
      <div class="actions">
        <a class="primary" href="/accounts/login/">Volver a iniciar sesión</a>
        <a class="secondary" href="/api/docs/">Ver documentación</a>
      </div>
    </main>
  </body>
</html>
